version = "1.0"
i18n = "domain_config"

[feature]

    [feature.mail]
        [feature.mail.mail_out]
        type = "boolean"
        default = 1

        [feature.mail.mail_in]
        type = "boolean"
        default = 1

    [feature.app]
        [feature.app.default_app]
        type = "app"
        filter = "is_webapp"
        default = "_none"

    [feature.registration]

        [feature.registration.enable_self_registration]
        type = "boolean"
        default = false

        [feature.registration.registration_require_and_verify_email]
        type = "boolean"
        default = false
        visible = "enable_self_registration"

        [feature.registration.registration_double_check_mail_stack_for_mail_notification]
        type = "alert"
        style = "info"
        visible = "enable_self_registration"
        # This message is hidden unless self-registration is enabled, to limit ui bloat
        # However we should also display a similar message on the webadmin form

        [feature.registration.registration_customize]
        type = "boolean"
        default = false

        [feature.registration.registration_tos]
        type = "string"
        visible = "registration_customize"

        [feature.registration.registration_invite_mail_template]
        type = "text"
        # Default value automatically filled by DomainConfigPanel if the current value is empty
        visible = "registration_customize"

        [feature.registration.registration_invite_notes]
        type = "text"
        # Default value automatically filled by DomainConfigPanel if the current value is empty
        visible = "registration_customize"

        [feature.registration.registration_self_registration_notes]
        type = "text"
        # Default value automatically filled by DomainConfigPanel if the current value is empty
        visible = "registration_customize && enable_self_registration"

    [feature.portal]
    # Only available for "topest" domains

        [feature.portal.enable_public_apps_page]
        type = "boolean"
        default = false

        [feature.portal.show_other_domains_apps]
        type = "boolean"
        default = true

        [feature.portal.portal_title]
        type = "string"
        default = "YunoHost"

        [feature.portal.portal_logo]
        type = "file"
        accept = ["image/png", "image/jpeg", "image/svg+xml"]
        mode = "python"
        bind = "/usr/share/yunohost/portal/customassets/{filename}{ext}"

        [feature.portal.portal_theme]
        type = "select"
        choices = ["system", "light", "dark", "omg", "legacy", "black", "synthwave", "halloween", "coffee", "cupcake", "cyberpunk", "valentine", "nord"]
        default = "system"

        [feature.portal.portal_tile_theme]
        type = "select"
        optional = false
        choices = ["descriptive", "simple", "periodic"]
        default = "simple"

        [feature.portal.search_engine]
        type = "url"
        default = ""

        [feature.portal.search_engine_name]
        type = "string"
        visible = "search_engine"

        [feature.portal.portal_user_intro]
        type = "text"

        [feature.portal.portal_public_intro]
        type = "text"

        # FIXME link to GCU

        [feature.portal.custom_css]
        # NB: this is wrote into "/usr/share/yunohost/portal/customassets/{domain}.custom.css"
        type = "text"

[dns]

    [dns.registrar]
    # This part is automatically generated in DomainConfigPanel

[cert]

    [cert.cert_]
    # The section has a different id than 'cert' otherwise it ends up with an unecessary "name" because it's defined for the panel (in i18n.json)

        [cert.cert_.cert_summary]
        type = "alert"
        # Automatically filled by DomainConfigPanel

        [cert.cert_.cert_validity]
        type = "number"
        readonly = true
        visible = "false"
        # Automatically filled by DomainConfigPanel

        [cert.cert_.cert_issuer]
        type = "string"
        visible = false
        # Automatically filled by DomainConfigPanel

        [cert.cert_.acme_eligible]
        type = "boolean"
        visible = false
        # Automatically filled by DomainConfigPanel

        [cert.cert_.acme_eligible_explain]
        type = "alert"
        style = "warning"
        visible = "acme_eligible == false || acme_eligible == null"

        [cert.cert_.cert_no_checks]
        type = "boolean"
        default = false
        visible = "acme_eligible == false || acme_eligible == null"

        [cert.cert_.cert_install]
        type = "button"
        icon = "star"
        style = "success"
        visible = "cert_issuer != 'letsencrypt'"
        enabled = "acme_eligible || cert_no_checks"

        [cert.cert_.cert_renew]
        type = "button"
        icon = "refresh"
        style = "warning"
        visible = "cert_issuer == 'letsencrypt'"
        enabled = "acme_eligible || cert_no_checks"
