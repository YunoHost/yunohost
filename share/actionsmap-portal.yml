_global:
    namespace: yunohost
    authentication:
        api: ldap_ynhuser
        cli: null
    lock: false
    cache: false

portal:
    category_help: Portal routes
    actions:

        ### portal_me()
        me:
            action_help: Allow user to fetch their own infos
            api: GET /me

        ### portal_apps()
        apps:
            action_help: Allow users to fetch lit of apps they have access to
            api: GET /me/apps

        ### portal_update()
        update:
            action_help: Allow user to update their infos (display name, mail aliases/forward, password, ...)
            api: PUT /update
            arguments:
                --fullname:
                    help: The full name of the user. For example 'Camille Dupont'
                    extra:
                        pattern: &pattern_fullname
                            - !!str ^([^\W_]{1,30}[ ,.'-]{0,3})+$
                            - "pattern_fullname"
                --mail:
                    help: Main email
                    extra:
                        pattern: &pattern_email
                            - !!str ^[\w.-]+@([^\W_A-Z]+([-]*[^\W_A-Z]+)*\.)+((xn--)?[^\W_]{2,})$
                            - "pattern_email"
                --mailforward:
                    help: Mailforward addresses to add
                    nargs: "*"
                    metavar: MAIL
                    extra:
                        pattern: &pattern_email_forward
                            - !!str ^[\w\+.-]+@([^\W_A-Z]+([-]*[^\W_A-Z]+)*\.)+((xn--)?[^\W_]{2,})$
                            - "pattern_email_forward"
                --mailalias:
                    help: Mail aliases to add
                    nargs: "*"
                    metavar: MAIL
                    extra:
                        pattern: *pattern_email
                --currentpassword:
                    help: Current password
                    nargs: "?"
                --newpassword:
                    help: New password to set
                    nargs: "?"

        ### portal_public()
        public:
            action_help: Allow anybody to list public apps and other infos regarding the public portal
            api: GET /public
            authentication:
                api: null

        ### portal_invitation_get()
        invitation_get:
            action_help: Obtain info about a pending invitation
            api: GET /invitation
            authentication:
                api: null
            arguments:
                --token:
                    help: The invitation token

        ### portal_invitation_consume()
        invitation_consume:
            action_help: Consume an invitation token to create an account
            api: POST /invitation
            authentication:
                api: null
            arguments:
                --token:
                    help: The invitation token
                --username:
                    help: The username of the new user. For example 'camille'
                    extra:
                        # The username may have been defined by the admin and may not be overridable
                        required: False
                        pattern: &pattern_username
                            - !!str ^[a-z0-9_\.]+$
                            - "pattern_username"
                --fullname:
                    help: The full name of the user. For example 'Camille Dupont'
                    extra:
                        required: True
                        pattern: *pattern_fullname
                --external-email:
                    help: An external email to be used as mail forward / recovery email
                    extra:
                        required: False
                        pattern: *pattern_email_forward
                --password:
                    help: The password chosen by the user
                    extra:
                        required: True
                --accept-tos:
                    help: Accept the Terms of Services (assuming some are defined by the admins)
                    default: false
                    action: store_true

        ### portal_registration_challenge()
        registration_challenge:
            action_help: Obtain an antibot challenge token and question to be able to submit a registration request
            api: GET /registration/challenge
            authentication:
                api: null

        ### portal_registration_challenge()
        registration_challenge:
            action_help: Obtain an antibot challenge token and question to be able to submit a registration request
            api: GET /registration/challenge
            authentication:
                api: null

        ### portal_registration_queue()
        registration_queue:
            action_help: Consume an invitation token to create an account
            api: POST /registration
            authentication:
                api: null
            arguments:
                --username:
                    help: The username of the new user. For example 'camille'
                    extra:
                        required: True
                        pattern: *pattern_username
                --fullname:
                    help: The full name of the user. For example 'Camille Dupont'
                    extra:
                        required: True
                        pattern: *pattern_fullname
                --external-email:
                    help: An external email to be used as mail forward / recovery email
                    extra:
                        required: False
                        pattern: *pattern_email_forward
                --password:
                    help: The password chosen by the user
                    extra:
                        required: True
                --notes:
                    help: Custom notes from the user to the admin regarding the registration request
                --accept-tos:
                    help: Accept the Terms of Services (assuming some are defined by the admins)
                    default: false
                    action: store_true
                --challenge-token:
                    help: The anti-bot challenge token
                    extra:
                        required: True
                --challenge-answer:
                    help: The anti-bot challenge answer
                    extra:
                        required: True

        ### portal_registration_confirm()
        registration_confirm:
            action_help: Confirm an account request via the link received by email
            api: PUT /registration/<request_id>/confirm
            authentication:
                api: null
            arguments:
                request_id:
                    help: The request ID of the account request to confirm
                    extra:
                        required: True
